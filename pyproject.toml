[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifemate-agent-training"
version = "0.1.0"
description = "Offline-capable Workflow-Guided Agent Training for ZAC LifeMate"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
