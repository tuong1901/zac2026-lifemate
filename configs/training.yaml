seed: 42
num_train_epochs: 2
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0001
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 10
save_strategy: steps
save_steps: 100
eval_strategy: steps
eval_steps: 100
gradient_checkpointing: true
max_grad_norm: 0.3
optim: adamw_torch
fp16: true
bf16: false
tf32: false
packing: false
resume_from_checkpoint: null
